name: Deal Scraper Bot

on:
  schedule:
    - cron: '*/5 * * * *' # Runs automatically every 5 minutes (maximum cloud frequency)
  workflow_dispatch: # Allows you to run the bot manually from your GitHub dashboard

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allows committing the updated deals.json back to the repository

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm install

      - name: Run Scrape Cycle
        run: |
          npx ts-node apps/bot/src/run-once.ts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
          EBAY_CAMPAIGN_ID: ${{ secrets.EBAY_CAMPAIGN_ID }}
          AMAZON_TAG: ${{ secrets.AMAZON_TAG }}
          AMAZON_IN_TAG: ${{ secrets.AMAZON_IN_TAG }}
          FLIPKART_AFFID: ${{ secrets.FLIPKART_AFFID }}
          TWITTER_APP_KEY: ${{ secrets.TWITTER_APP_KEY }}
          TWITTER_APP_SECRET: ${{ secrets.TWITTER_APP_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
          REDDIT_SUBREDDIT: ${{ secrets.REDDIT_SUBREDDIT }}
          MOCK_MODE: 'false' # Run live scrapers on Indian and global marketplaces

      - name: Commit and Push deals.json
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add apps/web/public/deals.json || true
          git commit -m "chore: update live deals feed [skip ci]" || true
          git push origin master || true
